name: Release

# v で始まるタグ（例: v0.1.0）を push すると、ビルド済みのアプリを GitHub Releases に公開する
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package
        run: |
          set -euo pipefail
          NAME="home-information-${GITHUB_REF_NAME}"
          mkdir -p "release/${NAME}/scripts"
          cp -r dist package.json package-lock.json ecosystem.config.cjs README.md "release/${NAME}/"
          cp scripts/start-windows.bat scripts/deploy-local.ps1 "release/${NAME}/scripts/"
          (cd release && zip -qr "${NAME}.zip" "${NAME}")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "$GITHUB_REF_NAME" --generate-notes
